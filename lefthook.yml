pre-commit:
  commands:
    biome:
      run: npx biome check --write --error-on-warnings --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    eslint:
      glob: "*.{css,md}"
      run: npx eslint --fix --max-warnings 0 --no-warn-ignored {staged_files}
      stage_fixed: true
