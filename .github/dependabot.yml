version: 2
updates:
  # Astro (the framework) and Zod (input validation) get a faster,
  # separate weekly PR; everything else is bulk-grouped and monthly.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "Africa/Johannesburg"
    groups:
      npm-critical:
        patterns:
          - "*"
    allow:
      - dependency-name: "astro"
      - dependency-name: "zod"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Africa/Johannesburg"
    groups:
      npm:
        patterns:
          - "*"
    ignore:
      - dependency-name: "astro"
      - dependency-name: "zod"
      # @astrojs/check (Volar-based) can't run on TypeScript 7 until
      # TS ships a stable replacement for the removed Strada API,
      # expected in 7.1. Drop this once @astrojs/check supports it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Africa/Johannesburg"
    groups:
      github-actions:
        patterns:
          - "*"
