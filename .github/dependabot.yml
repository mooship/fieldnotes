version: 2
updates:
  # One entry per ecosystem and directory: GitHub rejects the whole file otherwise, and Dependabot keeps using the last valid copy.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:00"
      timezone: "Africa/Johannesburg"
    open-pull-requests-limit: 2
    groups:
      npm-critical:
        patterns:
          - "astro"
          - "zod"
      npm:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "12:00"
      timezone: "Africa/Johannesburg"
    groups:
      github-actions:
        patterns:
          - "*"
